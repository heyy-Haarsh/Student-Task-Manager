apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-task-manager
  template:
    metadata:
      labels:
        app: student-task-manager
    spec:
      containers:
        - name: student-task-manager
          image: student-task-manager:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
